---
version: "2"
run:
  timeout: 10m
linters:
  enable:
    - whitespace
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.*ResourceData).Set
  exclusions:
    rules:
      - linters:
          - staticcheck
        text: "SA1019"
formatters:
  enable:
    - goimports
